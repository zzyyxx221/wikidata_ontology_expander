[project]
name = "wikidata-ontology-expander"
version = "0.1.0"
description = "Automatic ontology expansion pipeline based on seed schemas and Wikidata evidence."
requires-python = ">=3.10"
dependencies = [
  "requests>=2.28",
]

[project.scripts]
wikidata-ontology-expander = "wikidata_ontology_expander.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

