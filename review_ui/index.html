<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ontology Change Review</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <h1>本体扩充人工审查</h1>
          <p id="datasetMeta">导入 ChangeSet 后开始审查</p>
        </div>
        <div class="top-actions">
          <label class="file-button">
            导入 JSON
            <input id="fileInput" type="file" accept="application/json,.json" />
          </label>
          <button id="loadSampleBtn" type="button">示例数据</button>
          <button id="exportBtn" type="button">导出结果</button>
        </div>
      </header>

      <section class="summary-strip" aria-label="审查汇总">
        <div class="metric">
          <span id="totalCount">0</span>
          <small>全部</small>
        </div>
        <div class="metric accept">
          <span id="acceptedCount">0</span>
          <small>已接受</small>
        </div>
        <div class="metric reject">
          <span id="rejectedCount">0</span>
          <small>已拒绝</small>
        </div>
        <div class="metric review">
          <span id="pendingCount">0</span>
          <small>待处理</small>
        </div>
        <div class="metric">
          <span id="avgConfidence">0.00</span>
          <small>平均置信度</small>
        </div>
      </section>

      <section class="workspace">
        <aside class="queue-panel" aria-label="变更队列">
          <div class="filters">
            <label>
              搜索
              <input id="searchInput" type="search" placeholder="领域、实体、字段、来源ID" />
            </label>
            <label>
              动作
              <select id="actionFilter">
                <option value="">全部动作</option>
              </select>
            </label>
            <label>
              状态
              <select id="statusFilter">
                <option value="">全部状态</option>
                <option value="pending">待处理</option>
                <option value="accepted">已接受</option>
                <option value="rejected">已拒绝</option>
                <option value="needs_review">需复核</option>
              </select>
            </label>
            <label>
              最低置信度
              <input id="confidenceFilter" type="range" min="0" max="1" value="0" step="0.05" />
              <span id="confidenceValue">0.00</span>
            </label>
          </div>
          <div id="changeList" class="change-list" role="list"></div>
        </aside>

        <section class="detail-panel" aria-label="变更详情">
          <div id="emptyState" class="empty-state">
            <h2>等待选择变更</h2>
            <p>导入扩充结果后，可以在这里核对证据、修改值并记录审查意见。</p>
          </div>

          <article id="detailView" class="detail-view hidden">
            <div class="detail-header">
              <div>
                <span id="detailAction" class="tag">action</span>
                <h2 id="detailLabel">-</h2>
                <p id="detailSubhead">-</p>
              </div>
              <div id="confidenceBadge" class="confidence-badge">0.00</div>
            </div>

            <div class="detail-grid">
              <label>
                领域
                <input id="domainInput" type="text" />
              </label>
              <label>
                实体类型
                <input id="entityTypeInput" type="text" />
              </label>
              <label>
                模块
                <input id="moduleInput" type="text" />
              </label>
              <label>
                字段/关系
                <input id="fieldInput" type="text" />
              </label>
              <label>
                父节点
                <input id="parentInput" type="text" />
              </label>
              <label>
                目标类型
                <input id="targetTypeInput" type="text" />
              </label>
              <label>
                支持数
                <input id="supportInput" type="number" min="0" />
              </label>
            </div>

            <label class="value-editor">
              建议值
              <textarea id="valueInput" rows="5"></textarea>
            </label>

            <label class="value-editor">
              来源实体
              <textarea id="sourceIdsInput" rows="3"></textarea>
            </label>

            <section class="evidence-section">
              <h3>示例</h3>
              <div id="exampleList" class="evidence-list"></div>
            </section>

            <section class="evidence-section">
              <h3>证据</h3>
              <div id="evidenceList" class="evidence-list"></div>
            </section>

            <label class="notes-editor">
              审查意见
              <textarea id="notesInput" rows="4" placeholder="记录接受、拒绝或需要二次确认的原因"></textarea>
            </label>

            <div class="decision-bar">
              <button id="acceptBtn" class="decision accept" type="button">接受</button>
              <button id="reviewBtn" class="decision review" type="button">需复核</button>
              <button id="rejectBtn" class="decision reject" type="button">拒绝</button>
              <button id="resetBtn" type="button">重置</button>
            </div>
          </article>
        </section>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
